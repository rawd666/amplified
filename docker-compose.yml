services:
  app:
    build: .
    image: amplified:latest
    container_name: amplified
    restart: unless-stopped
    env_file:
      - server/.env
    volumes:
      - amplified_dbdata:/app/server/data
      - amplified_uploads:/app/server/uploads
    networks:
      - edge-traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge-traefik"
      - "traefik.http.middlewares.amplified-compress.compress=true"
      - "traefik.http.middlewares.amplified-compress.compress.encodings=br,zstd,gzip"
      - "traefik.http.middlewares.amplified-secheaders.headers.customResponseHeaders.Server="
      - "traefik.http.routers.amplified-web.rule=Host(`amplified-jo.com`)"
      - "traefik.http.routers.amplified-web.entrypoints=websecure"
      - "traefik.http.routers.amplified-web.tls.certresolver=le"
      - "traefik.http.routers.amplified-web.middlewares=amplified-compress@docker,amplified-secheaders@docker"
      - "traefik.http.services.amplified-web.loadbalancer.server.port=4000"

volumes:
  amplified_dbdata:
  amplified_uploads:
  # Old volume from before the data/uploads split - keep it around unused as
  # a safety net for a while after migrating, then remove once confirmed fine.
  amplified_data:
    external: false

networks:
  edge-traefik:
    external: true
